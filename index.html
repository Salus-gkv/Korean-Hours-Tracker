<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Korean Hours</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Korean Hours">
<meta name="theme-color" content="#4B6358">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #1F2A24;
    --paper: #F6F4EF;
    --line: #D8D2C4;
    --accent: #4B6358;
    --accent-dark: #37493F;
    --gold: #E9B44C;
    --clay: #B5654A;
    --muted: #7C7566;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header .sub { margin-top: 4px; font-size: 14px; color: var(--muted); }
  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav button {
    flex: 1;
    padding: 14px 0;
    background: none;
    border: none;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: inherit;
  }
  nav button.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
  main { flex: 1; padding: 24px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- Log screen ---- */
  .log-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .hours-input-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 8px;
  }
  .hours-input-row input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 44px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    width: 100%;
    font-family: inherit;
    -moz-appearance: textfield;
  }
  .hours-input-row input::-webkit-outer-spin-button,
  .hours-input-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .hours-input-row .unit { font-size: 18px; color: var(--muted); }
  .type-row { display: flex; gap: 8px; }
  .type-row button {
    flex: 1;
    min-height: 44px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 8px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .type-row button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }
  .field input[type="date"] {
    width: 100%;
    min-height: 44px;
    padding: 10px 0;
    border: none;
    border-bottom: 2px solid var(--line);
    font-size: 17px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }
  .field input[type="text"] {
    width: 100%;
    min-height: 44px;
    padding: 10px 0;
    border: none;
    border-bottom: 2px solid var(--line);
    font-size: 15px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }
  .field input:focus { outline: none; }
  .save-btn {
    width: 100%;
    min-height: 52px;
    padding: 16px;
    margin-top: 4px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .save-btn:active { background: var(--accent-dark); }
  .save-btn:disabled { background: var(--line); color: var(--muted); }
  .confirm {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
    color: var(--accent-dark);
    min-height: 18px;
  }
  .confirm.err { color: var(--clay); }
  .today-total {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .status-banner {
    text-align: center;
    font-size: 12px;
    color: var(--clay);
    padding: 6px 0;
  }

  /* ---- Trends screen ---- */
  .filters { display: flex; gap: 8px; margin-bottom: 18px; }
  .filters button {
    flex: 1;
    min-height: 44px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart-wrap {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 12px;
    height: 280px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .stat {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
  }
  .stat .num { font-size: 20px; font-weight: 600; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .breakdown { margin-top: 20px; }
  .breakdown h3, .entries-list h3 {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 10px;
  }
  .bd-row { margin-bottom: 10px; font-size: 13px; }
  .bd-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .bd-head .v { color: var(--muted); }
  .bd-track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bd-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bd-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 7px;
    vertical-align: baseline;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  .entries-list { margin-top: 24px; }
  .entry-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .entry-row .d { color: var(--muted); }
  .entry-row .n { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
  .entry-row .h { font-weight: 600; white-space: nowrap; }
  .tag {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 11px;
    color: var(--muted);
    vertical-align: 1px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Korean Hours</h1>
    <div class="sub">Study log</div>
  </header>

  <nav>
    <button id="tab-log" class="active">Log</button>
    <button id="tab-trends">Trends</button>
  </nav>

  <main>
    <section id="screen-log" class="screen active">
      <div class="log-card">
        <div class="field">
          <label for="minutesInput">Minutes</label>
          <div class="hours-input-row">
            <input type="number" id="minutesInput" inputmode="numeric" step="5" min="1" max="1440" placeholder="0" autofocus>
            <span class="unit">min</span>
          </div>
        </div>
        <div class="field">
          <label>Type</label>
          <div class="type-row" id="typeRow"></div>
        </div>
        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput">
        </div>
        <div class="field">
          <label for="noteInput">Note (optional)</label>
          <input type="text" id="noteInput" placeholder="e.g. TTMIK ch. 4">
        </div>
        <button class="save-btn" id="saveBtn">Save session</button>
        <div class="confirm" id="confirmMsg"></div>
      </div>
      <div class="today-total" id="todayTotal"></div>
    </section>

    <section id="screen-trends" class="screen">
      <div class="filters">
        <button data-period="day" class="periodBtn active">Day</button>
        <button data-period="week" class="periodBtn">Week</button>
        <button data-period="fort" class="periodBtn">2 Weeks</button>
        <button data-period="month" class="periodBtn">Month</button>
      </div>
      <div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas></div>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="entries-list" id="entriesList"></div>
    </section>
  </main>
</div>

<script>
// Paste the Apps Script /exec URL here after deploying (build step 3).
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwpmi7-HEioMBH-aBQjWs74yvIX7xzQ9Oi475cWZf-CO7JuMuppDourABGzvXbxLSvC/exec';

const TYPES = ['Vocab', 'Studying', 'Speaking'];
const SERIES = [...TYPES, 'Other'];
const TYPE_COLORS = {
  Vocab: '#4A3B32',
  Studying: '#CBB89D',
  Speaking: '#6E8B5B',
  Other: '#C3BCAC'
};
const WEEKLY_GOAL_HOURS = 10;   // the bar a Mon-Sun week has to clear to count as met
const MS_DAY = 86400000;
// 1970-01-05 was a Monday; epoch day 0 is 1970-01-01, so Mondays are day 4 + 7n.
const MONDAY_OFFSET = 4;
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let entries = [];
let chartInstance = null;
let currentPeriod = 'day';
// Starts empty and is never remembered between sessions: the type is a deliberate
// choice each time, so a stale chip can't ride along on the next save.
let selectedTypes = [];

// A session's hours split equally between the types it was tagged with, which is
// how both the stacked bars and the by-type bars are built. An untagged or unknown
// type lands on 'Other', and a row tagged twice ('Vocab, Vocab') is one share.
function typeShares(entry) {
  const list = parseTypes(entry.type);
  const names = list.map(t => (TYPES.includes(t) ? t : 'Other'));
  const uniq = [...new Set(names.length ? names : ['Other'])];
  const share = entry.hours / uniq.length;
  return uniq.map(t => [t, share]);
}

// Types are stored comma-joined in one row, e.g. 'Vocab, Speaking'.
function parseTypes(raw) {
  if (!raw) return [];
  return [...new Set(String(raw).split(',').map(t => t.trim()).filter(Boolean))];
}

/* ---------- dates (always local; never toISOString on a raw Date) ---------- */

function todayStr() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

// Whole-day number for an ISO date, DST-safe (compared as UTC midnights).
function dayNumFromISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / MS_DAY);
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${Number(m)}/${Number(d)}/${y.slice(2)}`;
}

function mdLabel(dayNum) {
  const d = new Date(dayNum * MS_DAY);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}

function fmtHours(h) {
  return String(Math.round(h * 100) / 100);
}

// Sessions are typed in minutes and stored as decimal hours, so short ones
// read as "40 min" rather than "0.67 hrs". Charts and stats stay in hours.
function fmtDuration(h) {
  const mins = Math.round(h * 60);
  return mins < 60 ? `${mins} min` : withUnit(h);
}

function withUnit(h) {
  const r = Math.round(h * 100) / 100;
  return `${r} ${r === 1 ? 'hr' : 'hrs'}`;
}

/* ---------- data ---------- */

async function loadEntries() {
  if (SHEET_URL.startsWith('PASTE_')) {
    showStatus('Backend URL not set yet — edit SHEET_URL in index.html.');
    entries = [];
    return;
  }
  try {
    const res = await fetch(SHEET_URL);
    const data = await res.json();
    clearStatus();
    const rows = Array.isArray(data) ? data : [];
    // A row whose date isn't a plain YYYY-MM-DD would land in no bucket at all and
    // render as NaN/NaN in the session list, so drop it and SAY SO. Silently losing
    // study time to a backend format change is the worst failure this app can have.
    entries = rows.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(String(r && r.date)));
    const skipped = rows.length - entries.length;
    if (skipped > 0) {
      showStatus(`${skipped} row${skipped === 1 ? '' : 's'} had an unreadable date and ${skipped === 1 ? 'was' : 'were'} skipped. Redeploy the Apps Script (see CLAUDE.md).`);
    }
  } catch (e) {
    entries = [];
    showStatus('Could not load data. Check your connection.');
  }
  sortEntries();
}

function sortEntries() {
  entries.sort((a, b) => a.date.localeCompare(b.date) || String(a.logged || '').localeCompare(String(b.logged || '')));
}

async function postEntry(entry) {
  // text/plain avoids a CORS preflight that Apps Script doesn't answer. Do not "fix" to application/json.
  const res = await fetch(SHEET_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(entry)
  });
  const out = await res.json().catch(() => ({ ok: true }));
  if (out && out.ok === false) throw new Error(out.error || 'rejected');
}

function clearStatus() {
  const el = document.getElementById('statusBanner');
  if (el) el.remove();
}

function showStatus(msg) {
  let el = document.getElementById('statusBanner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'statusBanner';
    el.className = 'status-banner';
    document.querySelector('main').prepend(el);
  }
  el.textContent = msg;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Log screen ---------- */

const minutesInput = document.getElementById('minutesInput');
const dateInput = document.getElementById('dateInput');
const noteInput = document.getElementById('noteInput');
const saveBtn = document.getElementById('saveBtn');
const confirmMsg = document.getElementById('confirmMsg');
const todayTotalEl = document.getElementById('todayTotal');

// The date field holds today until it is tapped. A home-screen app is resumed, not
// reloaded, so without this a page opened on Monday still offers Monday on Friday.
// An edit is respected while it stands; a successful save ends it, so the field can
// serve a second session on a backfilled date but rolls forward on the next resume.
let dateTouched = false;
dateInput.addEventListener('input', () => { dateTouched = true; });
function syncDate() {
  if (!dateTouched) dateInput.value = todayStr();
}
syncDate();

function renderTypeRow() {
  document.getElementById('typeRow').innerHTML = TYPES.map(t =>
    `<button type="button" class="typeBtn${selectedTypes.includes(t) ? ' active' : ''}" data-type="${t}" aria-pressed="${selectedTypes.includes(t)}">${t}</button>`
  ).join('');
  document.querySelectorAll('.typeBtn').forEach(b => {
    b.addEventListener('click', () => {
      const t = b.dataset.type;
      if (selectedTypes.includes(t)) {
        selectedTypes = selectedTypes.filter(x => x !== t);
      } else {
        selectedTypes = TYPES.filter(x => selectedTypes.includes(x) || x === t);
      }
      renderTypeRow();
    });
  });
}
renderTypeRow();

function renderTodayTotal() {
  const today = todayStr();
  const mine = entries.filter(e => e.date === today);
  if (mine.length === 0) {
    todayTotalEl.textContent = 'Nothing logged today yet';
    return;
  }
  const total = mine.reduce((s, e) => s + e.hours, 0);
  todayTotalEl.textContent = `Today: ${fmtDuration(total)} across ${mine.length} session${mine.length === 1 ? '' : 's'}`;
}

let confirmTimer = null;
function setConfirm(msg, isErr) {
  confirmMsg.textContent = msg;
  confirmMsg.classList.toggle('err', !!isErr);
  clearTimeout(confirmTimer);
  if (msg) confirmTimer = setTimeout(() => { confirmMsg.textContent = ''; confirmMsg.classList.remove('err'); }, 2500);
}

saveBtn.addEventListener('click', async () => {
  const minutes = parseFloat(minutesInput.value);
  const date = dateInput.value;
  const note = noteInput.value.trim();
  if (!isFinite(minutes) || minutes <= 0 || minutes > 1440 || !date) {
    setConfirm('Enter the minutes you studied.', true);
    return;
  }
  if (selectedTypes.length === 0) {
    setConfirm('Pick at least one type.', true);
    return;
  }
  const hours = Math.round((minutes / 60) * 10000) / 10000;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  confirmMsg.classList.remove('err');
  confirmMsg.textContent = '';
  clearTimeout(confirmTimer);
  try {
    const entry = { date, hours, note, type: selectedTypes.join(', ') };
    await postEntry(entry);
    entries.push({ ...entry, logged: new Date().toISOString() });
    sortEntries();
    setConfirm('Saved.', false);
    minutesInput.value = '';
    noteInput.value = '';
    selectedTypes = [];
    renderTypeRow();
    dateTouched = false;
    renderTodayTotal();
    renderTrends();
  } catch (e) {
    // Leave the typed minutes in place so nothing is lost.
    setConfirm('Could not save. Check your connection and try again.', true);
  }
  saveBtn.disabled = false;
  saveBtn.textContent = 'Save session';
});

/* ---------- nav ---------- */

document.getElementById('tab-log').addEventListener('click', () => switchTab('log'));
document.getElementById('tab-trends').addEventListener('click', () => switchTab('trends'));

function switchTab(tab) {
  document.getElementById('tab-log').classList.toggle('active', tab === 'log');
  document.getElementById('tab-trends').classList.toggle('active', tab === 'trends');
  document.getElementById('screen-log').classList.toggle('active', tab === 'log');
  document.getElementById('screen-trends').classList.toggle('active', tab === 'trends');
  if (tab === 'log') syncDate();
  if (tab === 'trends') {
    renderTrends();      // instant, from what's already loaded
    refreshEntries();    // then reconcile against the sheet
  }
}

/* ---------- Trends screen ---------- */

document.querySelectorAll('.periodBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.periodBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    renderTrends();
  });
});

// Which bucket an entry falls in, for the current period.
function bucketKey(period, iso) {
  if (period === 'month') {
    const [y, m] = iso.split('-').map(Number);
    return 'm' + (y * 12 + (m - 1));
  }
  const n = dayNumFromISO(iso);
  if (period === 'day') return 'd' + n;
  const span = period === 'week' ? 7 : 14;
  return period + Math.floor((n - MONDAY_OFFSET) / span);
}

// The buckets to draw, oldest first. Each has a key, a label, and a start day.
function buildBuckets(period) {
  const out = [];
  if (period === 'day') {
    const today = dayNumFromISO(todayStr());
    for (let i = 29; i >= 0; i--) {
      const n = today - i;
      out.push({ key: 'd' + n, label: mdLabel(n), startDay: n, endDay: n });
    }
    return out;
  }
  if (period === 'week' || period === 'fort') {
    const span = period === 'week' ? 7 : 14;
    const cur = Math.floor((dayNumFromISO(todayStr()) - MONDAY_OFFSET) / span);
    for (let i = 11; i >= 0; i--) {
      const idx = cur - i;
      const start = idx * span + MONDAY_OFFSET;
      out.push({ key: period + idx, label: mdLabel(start), startDay: start, endDay: start + span - 1 });
    }
    return out;
  }
  const now = new Date();
  const cur = now.getFullYear() * 12 + now.getMonth();
  for (let i = 11; i >= 0; i--) {
    const idx = cur - i;
    const y = Math.floor(idx / 12), m = idx % 12;
    const ny = m === 11 ? y + 1 : y, nm = m === 11 ? 0 : m + 1;
    out.push({
      key: 'm' + idx,
      label: m === 0 ? `${MONTH_NAMES[m]} '${String(y).slice(2)}` : MONTH_NAMES[m],
      startDay: dayNumFromISO(`${y}-${String(m + 1).padStart(2, '0')}-01`),
      endDay: dayNumFromISO(`${ny}-${String(nm + 1).padStart(2, '0')}-01`) - 1
    });
  }
  return out;
}

// The first day anything was logged. Everything before it is untracked time and is
// kept out of every average.
function trackingStart() {
  return entries.length ? Math.min(...entries.map(e => dayNumFromISO(e.date))) : null;
}

// The denominator for the average: tracked days, expressed in whole and part
// buckets. A bucket counts only for the days it shares with the tracked stretch, so
// a week three days old counts as 3/7 and the month you are six days into as 6/30.
// Counting those as whole buckets divided the average by untracked time and read
// far too low. All four periods therefore report the same rate in different units.
// Whether a whole bucket has been tracked from end to end. Until one has, the
// average is a projection out of a part bucket -- eight days reading as 65.5
// hrs/month -- so the card shows a dash rather than a number that overstates.
// The bucket holding today is still in progress and does not count.
// Days in a row with at least one session, counted back from today. A day with
// nothing logged yet does not break the run: the count starts at yesterday until
// today has an entry, so the streak doesn't read zero every morning and then jump
// back up in the evening.
function dayStreak() {
  const days = new Set(entries.map(e => dayNumFromISO(e.date)));
  const today = dayNumFromISO(todayStr());
  let cur = days.has(today) ? today : today - 1;
  let n = 0;
  while (days.has(cur)) { n++; cur--; }
  return n;
}

function hasCompleteBucket(buckets) {
  const first = trackingStart();
  if (first === null) return false;
  const today = dayNumFromISO(todayStr());
  return buckets.some(b => b.startDay >= first && b.endDay < today);
}

function activeBuckets(buckets) {
  const first = trackingStart();
  if (first === null) return buckets.length;
  const today = dayNumFromISO(todayStr());
  let n = 0;
  for (const b of buckets) {
    const lo = Math.max(b.startDay, first);
    const hi = Math.min(b.endDay, today);
    if (hi >= lo) n += (hi - lo + 1) / (b.endDay - b.startDay + 1);
  }
  return n || 1;
}

// 3-bucket simple moving average; partial at the start so the line is continuous.
// Buckets that ended before tracking began are null, not zero: averaging them in
// would drag the line down with time that was never missed study, only absence of
// an app. Chart.js simply starts the line at the first tracked bucket.
function movingAverage(values, window, buckets) {
  const first = trackingStart();
  const from0 = first === null ? 0 : buckets.findIndex(b => b.endDay >= first);
  const start = from0 < 0 ? values.length : from0;
  return values.map((_, i) => {
    if (i < start) return null;
    const from = Math.max(start, i - window + 1);
    const slice = values.slice(from, i + 1);
    return Math.round((slice.reduce((s, v) => s + v, 0) / slice.length) * 100) / 100;
  });
}

// How many Mon-Sun weeks have ever reached the goal. A running total with no
// denominator: it only goes up, and the selected period does not change it.
// Empty weeks can't qualify, so grouping the entries is enough — no need to walk
// the calendar. The current week counts as soon as it clears the bar.
function weeksGoalMet() {
  const sums = new Map();
  for (const e of entries) {
    const wk = Math.floor((dayNumFromISO(e.date) - MONDAY_OFFSET) / 7);
    sums.set(wk, (sums.get(wk) || 0) + e.hours);
  }
  let n = 0;
  for (const v of sums.values()) if (v >= WEEKLY_GOAL_HOURS) n++;
  return n;
}

function renderTrends() {
  const chartWrap = document.getElementById('chartWrap');
  const statsGrid = document.getElementById('statsGrid');
  const breakdownEl = document.getElementById('breakdown');
  const entriesListEl = document.getElementById('entriesList');

  if (entries.length === 0) {
    chartWrap.innerHTML = '<div class="empty">No sessions yet. Log one to see your trend.</div>';
    statsGrid.innerHTML = '';
    breakdownEl.innerHTML = '';
    entriesListEl.innerHTML = '';
    return;
  }
  if (!document.getElementById('chart')) {
    chartWrap.innerHTML = '<canvas id="chart"></canvas>';
  }

  // Sum sessions into daily, then bucket, totals.
  const sums = new Map();
  for (const e of entries) {
    const k = bucketKey(currentPeriod, e.date);
    sums.set(k, (sums.get(k) || 0) + e.hours);
  }

  // The same sums again, split by type, for the stacked series.
  const typeSums = new Map();
  for (const e of entries) {
    const k = bucketKey(currentPeriod, e.date);
    for (const [t, h] of typeShares(e)) {
      if (!typeSums.has(t)) typeSums.set(t, new Map());
      const m = typeSums.get(t);
      m.set(k, (m.get(k) || 0) + h);
    }
  }

  const buckets = buildBuckets(currentPeriod);
  const labels = buckets.map(b => b.label);
  const values = buckets.map(b => Math.round((sums.get(b.key) || 0) * 100) / 100);
  const trend = movingAverage(values, 3, buckets);

  // One dataset per type that actually appears in this window; an unused type is
  // left out rather than sitting in the legend as a colour that never shows.
  const barSets = SERIES.filter(t => {
    const m = typeSums.get(t);
    return m && buckets.some(b => m.get(b.key));
  }).map(t => {
    const m = typeSums.get(t);
    return {
      type: 'bar',
      label: t,
      // full precision: rounding each series first leaves the stack a hundredth
      // short of the day's own total, which the tooltip footer would then report
      data: buckets.map(b => m.get(b.key) || 0),
      backgroundColor: TYPE_COLORS[t],
      borderRadius: 2,
      categoryPercentage: 0.88,
      barPercentage: 0.9,
      stack: 'types',
      order: 2
    };
  });

  const ctx = document.getElementById('chart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        ...barSets,
        {
          type: 'line',
          label: 'trend',
          data: trend,
          borderColor: '#E9B44C',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: false,
          stack: 'trend',
          order: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        // No legend: the by-type bars under the chart carry the same colours and
        // name each type beside its hours, so a second key would only repeat them.
        legend: { display: false },
        tooltip: {
          callbacks: {
            // A type contributing nothing to this bucket is noise in the tooltip.
            label: c => c.dataset.label === 'trend'
              ? `trend ${fmtHours(c.parsed.y)}`
              : (c.parsed.y ? `${c.dataset.label} ${withUnit(c.parsed.y)}` : null),
            footer: items => {
              const bars = items.filter(i => i.dataset.label !== 'trend');
              if (bars.length < 2) return '';
              return `total ${withUnit(bars.reduce((s, i) => s + i.parsed.y, 0))}`;
            }
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          ticks: {
            color: '#7C7566',
            font: { size: 10 },
            maxRotation: 0,
            autoSkipPadding: 8
          },
          grid: { display: false }
        },
        y: {
          stacked: true,
          beginAtZero: true,
          title: { display: true, text: 'hours', color: '#7C7566', font: { size: 11 } },
          ticks: { color: '#7C7566', font: { size: 11 }, precision: 1 },
          grid: { color: '#D8D2C4' }
        }
      }
    }
  });

  // ---- stats ----
  // Top row follows the selected period, bottom row is all time. On the Day tab the
  // top-left card is the streak instead of a window total, which there would read as
  // the same number as all-time directly beneath it. The other periods name their
  // window ("Total, last 12 weeks") for the same reason.
  const windowLabel = {
    day: 'Total, last 30 days',
    week: 'Total, last 12 weeks',
    fort: 'Total, last 24 weeks',
    month: 'Total, last 12 months'
  }[currentPeriod];
  const avgLabel = {
    day: 'Avg / day', week: 'Avg / week', fort: 'Avg / 2 wks', month: 'Avg / month'
  }[currentPeriod];
  const unitWord = {
    day: 'day', week: 'week', fort: '2 weeks', month: 'month'
  }[currentPeriod];

  const total = values.reduce((s, v) => s + v, 0);
  const avg = total / activeBuckets(buckets);
  const allTime = entries.reduce((s, e) => s + e.hours, 0);
  const met = weeksGoalMet();
  const round1 = n => Math.round(n * 10) / 10;
  const avgReady = hasCompleteBucket(buckets);
  const avgNum = avgReady ? fmtHours(round1(avg)) : '—';
  const avgLbl = avgReady ? avgLabel : `${avgLabel} · after a full ${unitWord}`;

  const streak = dayStreak();
  const topLeft = currentPeriod === 'day'
    ? `<div class="stat"><div class="num">${streak}</div><div class="lbl">Day streak</div></div>`
    : `<div class="stat"><div class="num">${fmtHours(round1(total))}</div><div class="lbl">${windowLabel}</div></div>`;

  statsGrid.innerHTML = `
    ${topLeft}
    <div class="stat"><div class="num">${avgNum}</div><div class="lbl">${avgLbl}</div></div>
    <div class="stat"><div class="num">${fmtHours(round1(allTime))}</div><div class="lbl">Hours all time</div></div>
    <div class="stat"><div class="num">${met}</div><div class="lbl">Weeks hitting ${WEEKLY_GOAL_HOURS} hrs</div></div>
  `;

  // ---- hours by type, for the visible window ----
  const windowStart = buckets[0].startDay;
  const inWindow = entries.filter(e => dayNumFromISO(e.date) >= windowStart);
  const byType = new Map();
  for (const e of inWindow) {
    for (const [t, h] of typeShares(e)) byType.set(t, (byType.get(t) || 0) + h);
  }
  const windowTotal = inWindow.reduce((s, e) => s + e.hours, 0);
  const rows = SERIES.filter(t => byType.get(t));
  breakdownEl.innerHTML = rows.length === 0 ? '' : '<h3>By type</h3>' + rows.map(t => {
    const h = byType.get(t);
    const pct = windowTotal ? Math.round((h / windowTotal) * 100) : 0;
    return `<div class="bd-row">
        <div class="bd-head"><span><span class="bd-dot" style="background:${TYPE_COLORS[t]}"></span>${escapeHtml(t)}</span><span class="v">${withUnit(Math.round(h * 10) / 10)} · ${pct}%</span></div>
        <div class="bd-track"><div class="bd-fill" style="width:${pct}%;background:${TYPE_COLORS[t]}"></div></div>
      </div>`;
  }).join('');

  // ---- recent sessions: newest first, same-day entries ordered by Logged ----
  const recent = [...entries].reverse().slice(0, 10);
  entriesListEl.innerHTML = '<h3>Recent sessions</h3>' + recent.map(e =>
    `<div class="entry-row">
       <span class="d">${fmtDate(e.date)}${parseTypes(e.type).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}${e.note ? `<span class="n">${escapeHtml(e.note)}</span>` : ''}</span>
       <span class="h">${fmtDuration(e.hours)}</span>
     </div>`
  ).join('');
}

/* ---------- staying in sync with the sheet ---------- */

// Saving appends to `entries` locally so logging never waits on a round trip, and
// for a long time that was the ONLY thing that ever changed the list after startup.
// A row deleted or edited in the sheet therefore lived on in the app indefinitely,
// because an iOS home-screen app is usually RESUMED rather than reloaded. Any time
// the app comes back into view, re-read the sheet and let it win.
let refreshing = false;

async function refreshEntries() {
  if (refreshing) return;
  refreshing = true;
  try {
    await loadEntries();
    renderTodayTotal();
    if (document.getElementById('screen-trends').classList.contains('active')) {
      renderTrends();
    }
  } finally {
    refreshing = false;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { syncDate(); refreshEntries(); }
});
window.addEventListener('pageshow', e => { if (e.persisted) { syncDate(); refreshEntries(); } });

/* ---------- init ---------- */

(async () => {
  renderTodayTotal();
  await loadEntries();
  renderTodayTotal();
  renderTrends();
})();
</script>
</body>
</html>
